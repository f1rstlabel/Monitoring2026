apiVersion: apps/v1
kind: Deployment
metadata:
  name: govmonitor-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: govmonitor-frontend
  template:
    metadata:
      labels:
        app: govmonitor-frontend
    spec:
      containers:
        - name: govmonitor-frontend
          image: ghcr.io/f1rstlabel/govmonitor-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: govmonitor-frontend-service
  namespace: default
spec:
  selector:
    app: govmonitor-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30082
  type: NodePort
