<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer Hexagon Frame -->
  <polygon points="50,10 85,30 85,70 50,90 15,70 15,30" stroke="#0082FF" stroke-width="4.5" stroke-linejoin="round"/>
  
  <!-- Inner White Dashed Ring -->
  <circle cx="50" cy="50" r="25" stroke="#FFFFFF" stroke-width="3.5" stroke-dasharray="13 10" opacity="0.95"/>
  
  <!-- Inner X Pattern Lines -->
  <line x1="32" y1="32" x2="68" y2="68" stroke="#0082FF" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="68" y1="32" x2="32" y2="68" stroke="#0082FF" stroke-width="4.5" stroke-linecap="round"/>
  
  <!-- Outer Hexagon Vertex Nodes -->
  <circle cx="50" cy="10" r="5" fill="#0082FF"/>
  <circle cx="85" cy="30" r="5" fill="#0082FF"/>
  <circle cx="85" cy="70" r="5" fill="#0082FF"/>
  <circle cx="50" cy="90" r="5" fill="#0082FF"/>
  <circle cx="15" cy="70" r="5" fill="#0082FF"/>
  <circle cx="15" cy="30" r="5" fill="#0082FF"/>
  
  <!-- Inner X End Nodes -->
  <circle cx="32" cy="32" r="4.5" fill="#0082FF"/>
  <circle cx="68" cy="32" r="4.5" fill="#0082FF"/>
  <circle cx="32" cy="68" r="4.5" fill="#0082FF"/>
  <circle cx="68" cy="68" r="4.5" fill="#0082FF"/>
</svg>
